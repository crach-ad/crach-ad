&lt;script&gt;
(()=&gt;{
const root=document.getElementById(&#x27;conference-bell&#x27;),q=s=&gt;root.querySelector(s);
let running=false,elapsed=0,anchor=0,demo=false,baseSession=1,audio=null,lastPhaseIndex=0,demoDone=false;
const reduced=window.matchMedia?.(&#x27;(prefers-reduced-motion: reduce)&#x27;);
function timing(){return demo?{meeting:10000,rotation:5000,cycle:15000}:{meeting:300000,rotation:60000,cycle:360000};}
function currentElapsed(){return running?Math.max(0,Date.now()-anchor):elapsed;}
function snapshot(){const t=timing(),e=currentElapsed(),round=Math.floor(e/t.cycle),within=e%t.cycle,rotation=within&gt;=t.meeting;return {t,e,round,rotation,phaseIndex:round*2+(rotation?1:0),fraction:rotation?(within-t.meeting)/t.rotation:within/t.meeting};}
function save(){const s=snapshot();try{window.openai?.setWidgetState({modelContent:{minutes:5,rotationMinutes:1,sound:q(&#x27;[data-sound]&#x27;).checked,session:baseSession+(demo?0:s.round),phase:s.rotation?&#x27;rotation&#x27;:&#x27;meeting&#x27;},privateContent:{version:2,running,elapsed:s.e,anchor,demo,baseSession}})?.catch(()=&gt;{});}catch{}}
function restore(state){const m=state?.modelContent,p=state?.privateContent;if(m){baseSession=Math.max(1,Math.floor(Number(m.session)||1));q(&#x27;[data-sound]&#x27;).checked=m.sound!==false;}if(p?.version===2&amp;&amp;Number.isFinite(p.elapsed)&amp;&amp;p.elapsed&gt;=0){demo=!!p.demo;elapsed=p.elapsed;baseSession=Math.max(1,Math.floor(Number(p.baseSession)||baseSession));running=!!p.running&amp;&amp;Number.isFinite(p.anchor);anchor=p.anchor||0;}lastPhaseIndex=snapshot().phaseIndex;render(false);}
function prepareAudio(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)throw Error();if(!audio)audio=new C();audio.resume().catch(()=&gt;q(&#x27;[data-notice]&#x27;).textContent=&#x27;Audio unavailable. The visual timer will continue.&#x27;);}catch{q(&#x27;[data-notice]&#x27;).textContent=&#x27;Audio unavailable. The visual timer will continue.&#x27;;}}
function bell(rotation=true){if(!q(&#x27;[data-sound]&#x27;).checked)return;prepareAudio();if(!audio)return;const now=audio.currentTime;const notes=rotation?[0,.65,1.3]:[0,.45];notes.forEach(delay=&gt;{[660,1320,1980].forEach((freq,i)=&gt;{const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=rotation?freq:freq*1.25;g.gain.setValueAtTime(0,now+delay);g.gain.linearRampToValueAtTime(.16/(i+1),now+delay+.008);g.gain.exponentialRampToValueAtTime(.0001,now+delay+1.6);o.connect(g);g.connect(audio.destination);o.start(now+delay);o.stop(now+delay+1.7);});});}
function render(allowBell=true){let s=snapshot();if(demo&amp;&amp;s.e&gt;=s.t.cycle){if(allowBell&amp;&amp;running)bell(false);running=false;elapsed=0;demo=false;demoDone=true;lastPhaseIndex=0;s=snapshot();if(allowBell)save();}
if(s.phaseIndex!==lastPhaseIndex){if(allowBell&amp;&amp;running)bell(s.rotation);lastPhaseIndex=s.phaseIndex;if(allowBell)save();}
const fill=s.rotation?1-s.fraction:s.fraction,seconds=Math.ceil((s.rotation?60:300)*(1-s.fraction));
q(&#x27;[data-time]&#x27;).textContent=String(Math.floor(seconds/60)).padStart(2,&#x27;0&#x27;)+&#x27;:&#x27;+String(seconds%60).padStart(2,&#x27;0&#x27;);q(&#x27;[data-phase]&#x27;).textContent=(demo?&#x27;Demo · &#x27;:&#x27;&#x27;)+(s.rotation?&#x27;Rotation&#x27;:&#x27;Meeting&#x27;);
q(&#x27;[data-status]&#x27;).textContent=!running&amp;&amp;s.e===0?(demoDone?&#x27;Demo complete. Ready to begin.&#x27;:&#x27;Ready for the first family.&#x27;):!running?&#x27;Paused — resume when ready.&#x27;:s.rotation?&#x27;Time to move to your next meeting.&#x27;:seconds&lt;=60?&#x27;One minute to wrap up.&#x27;:&#x27;Time for a good conversation.&#x27;;
q(&#x27;[data-start]&#x27;).textContent=running?&#x27;Pause&#x27;:s.e&gt;0?&#x27;Resume&#x27;:&#x27;Start meetings&#x27;;q(&#x27;[data-session]&#x27;).textContent=baseSession+(demo?0:s.round);
q(&#x27;[data-fill]&#x27;).textContent=s.rotation?&#x27;Draining · &#x27;+Math.round(fill*100)+&#x27;% remaining&#x27;:Math.round(fill*100)+&#x27;% of meeting elapsed&#x27;;
q(&#x27;[data-logo-fill]&#x27;).setAttribute(&#x27;y&#x27;,251-230*fill);q(&#x27;[data-logo-fill]&#x27;).setAttribute(&#x27;height&#x27;,230*fill);
q(&#x27;.logo&#x27;).setAttribute(&#x27;aria-label&#x27;,s.rotation?&#x27;Cracked school crest draining during the one-minute rotation&#x27;:&#x27;School crest filling during the five-minute meeting&#x27;);
q(&#x27;[data-leak]&#x27;).style.display=s.rotation?&#x27;&#x27;:&#x27;none&#x27;;
const crackProgress=Math.min(1,s.fraction*8);q(&#x27;[data-crack]&#x27;).style.strokeDashoffset=String(160*(1-crackProgress));
q(&#x27;[data-puddle]&#x27;).setAttribute(&#x27;rx&#x27;,6+27*s.fraction);q(&#x27;[data-puddle]&#x27;).setAttribute(&#x27;opacity&#x27;,.2+.5*s.fraction);

}
function reset(){const s=snapshot();baseSession+=demo?0:s.round;running=false;elapsed=0;demo=false;demoDone=false;lastPhaseIndex=0;render();save();}

    const canonicalState = JSON.stringify(
      storedState,
      (_key, /** @type {unknown} */ value) => {
        if (typeof value === "number" && !Number.isFinite(value)) {
          throw new TypeError("Widget state must contain finite numbers");
        }
        return value;
      },
    );
    if (new TextEncoder().encode(canonicalState).length > 16 * 1024) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    return storedState;
  };
  let storage = null;
  let state = null;
  try {
    const localStorage = globalThis.localStorage;
    const probeKey = `${storageKey}:probe`;
    localStorage.setItem(probeKey, "1");
    localStorage.removeItem(probeKey);
    storage = localStorage;
    const savedState = storage.getItem(storageKey);
    if (savedState != null) {
      try {
        state = parseState(savedState);
      } catch {
        // Invalid saved state does not disable future writes.
      }
    }
  } catch {
    storage = null;
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height === "number" &&
        Number.isFinite(height) &&
        height >= 0 &&
        height <= 10_000
      ) {
        frame.style.height = Math.ceil(height) + "px";
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
</script>
</body>
</html>
